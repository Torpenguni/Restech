name: Fetch real event photos
on:
  push:
    branches: [redesign-international]
    paths: [".github/scripts/fetch_images.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python .github/scripts/fetch_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/real
          git commit -m "Add real Restech event photos (fetched from restechexpo.com)" || echo "nothing to commit"
          git push
